name: Deploy a GitHub Pages

# Pendiente de dos requisitos que no se pueden resolver desde el workflow:
#
#   1. GitHub Pages tiene que estar activado en Ajustes → Pages, con origen
#      "GitHub Actions". El GITHUB_TOKEN de Actions no tiene permiso para crear
#      el sitio, así que `configure-pages` con `enablement: true` falla con
#      "Resource not accessible by integration".
#   2. Este repositorio es privado y Pages sobre repositorios privados requiere
#      un plan de pago (Pro, Team o Enterprise); si no, hay que hacerlo público.
#
# Hasta entonces se lanza solo a mano, para no dejar main en rojo en cada push.
# Una vez cumplidos los dos requisitos, basta con devolver el disparador
# `push: branches: [main]` para que publique en cada cambio.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela la que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
